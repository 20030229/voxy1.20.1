name: 自动打包
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 赋予权限
        run: chmod +x gradlew
      - name: 开始打包
        run: ./gradlew build
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 打包好的文件
          path: build/libs/
